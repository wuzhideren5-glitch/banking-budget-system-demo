[project]
name = "banking-budget-backend"
version = "0.1.0"
description = "银行预算系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "aiosqlite==0.20.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "python-multipart==0.0.26",
    "langgraph",
    "httpx>=0.28.0",
    "python-docx",
    "pypdf",
    "Pillow",
    "pytesseract",
    "python-pptx",
    "matplotlib",
    "lark-oapi==1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false
